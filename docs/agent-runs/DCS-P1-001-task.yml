Acceptance_Criteria:
  - "มีโครงโฟลเดอร์ apps-script/ ตรง docs/08 ครบชั้นหลัก"
  - "คำสั่ง npm run lint, typecheck, test, build รันผ่านบนเครื่องพัฒนาโดยไม่ต้องมี Workspace"
  - "Unit test อย่างน้อย 3 กรณีจำลองผ่าน (schema, auth role, column-name mapping)"
  - "personnel source เป็น mock — ไม่มี URL/Sheet id จริงในโค้ด"
  - "ไม่มี .clasp.json ที่มี scriptId ใน git; .gitignore กัน secret"
  - "ไม่มี credential, token, spreadsheet id production ใน repository"
  - "README/docs อธิบายวิธีรันจำลองชัดเจน"
  - "มี DCS-P1-001-task.yml และ DCS-P1-001-evidence.md ครบก่อนปิดงาน"
  - "รายงานยืนยันว่าไม่ได้ clasp push / deploy / เชื่อม Workspace"

ความเสี่ยง_และ_การตัดสินใจที่ต้องรอ:
