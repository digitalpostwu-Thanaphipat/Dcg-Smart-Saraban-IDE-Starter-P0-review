ขอบเขต:
  ทำ:
    - "ยืนยัน/จัด Git repository ของชุด IDE (ถ้ายังไม่มีใน working tree หลัก) และ .gitignore ที่กัน secret/.clasp.json/credentials"
    - "สร้างโครง apps-script/ ตาม docs/08: server/{entry,auth,domain,services,data,config,jobs,shared}, client/, tests/{unit,e2e}, scripts/"
    - "ตั้งค่า package.json: TypeScript, ESLint, Prettier, Vitest หรือ Jest (unit), esbuild/หรือ bundler สำหรับ bundle → Apps Script"
    - "ตั้งค่า tsconfig.json (strict พอสมควร) และ build script TypeScript → JavaScript แบบ IIFE/CJS ที่เหมาะกับ V8 Apps Script"
    - "ตั้งค่า ESLint + Prettier และสคริปต์ npm: lint, typecheck, test, build"
    - "โครง appsscript.json ขั้นต่ำ (V8) — ห้ามใส่ OAuth secret; scopes ขั้นต่ำเป็น placeholder ที่ไม่ผูกโปรเจกต์จริง"
    - "Router/entry stub + requireAuth/requireRole แบบจำลอง (fixture user) — ข้อความผิดพลาดภาษาไทย"
    - "ชั้น data: Repository interface + Fake/InMemory Sheet Gateway + Schema Validator อ่านจาก fixture ที่สอดคล้อง data-dictionary (ยังไม่ generate manifest.json จาก Sheets จริง)"
    - "personnel-source แบบ Mock Contract เท่านั้น (ADR-01 เงื่อนไข Phase 1)"
    - "มาตรฐานผลลัพธ์ API / error envelope ภาษาไทยใน server/shared"
    - "Unit test จำลองอย่างน้อย: schema header หาย/ซ้ำ, auth ปฏิเสธบทบาทผิด, repository อ่านตามชื่อคอลัมน์"
    - "Playwright: ตั้งค่า playwright.config + โครง e2e ว่างหรือ smoke ต่อ local mock เท่านั้น — ห้ามชี้ Staging URL จริง"
    - "เอกสารคำสั่งรัน: README ส่วน dev (lint/typecheck/test/build) ภาษาไทยหรือไทย+อังกฤษสั้น"
    - "สร้าง docs/agent-runs/DCS-P1-001-evidence.md เมื่อจบงาน"
  ไม่ทำ:
    - "deploy / clasp push / clasp login ไปโปรเจกต์จริง"
    - "สร้างหรือเชื่อม Google Sheets / Drive / Workspace จริง"
    - "commit .clasp.json ที่มี scriptId, token, spreadsheet id, service account"
    - "ใช้หรือนำเข้าข้อมูลบุคลากรจริง เอกสารจริง Secret"
    - "ตั้งค่า SLA จริง (ADR-03 Deferred) หรือ RPO/RTO จริง (ADR-04 Deferred)"
    - "เปิด AI API กับข้อมูลจริง (ADR-07)"
    - "Business flow เต็ม (ร่าง/กลั่นกรอง/ออกเลข) — เป็นเฟสถัดไปหลัง scaffold ผ่าน"
    - "Pilot หนังสือภายในครบ E2E — เฟส 3"
    - "Production / Staging Web App"
    - "ติดตั้ง Skill ภายนอกเพิ่มนอก Playwright ที่ skills.lock อนุมัติแนวแล้ว (ล็อกรุ่นใน package.json เมื่อเพิ่ม)"

