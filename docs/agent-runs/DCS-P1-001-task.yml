  - "path ไฟล์ schema-manifest.json ตอน generate — ใช้ข้อเสนอใน schema-manifest-spec จนกว่าจะยืนยัน"
  - "Gate S (Workspace) ยังไม่เปิด — e2e จริงเลื่อน"
  - "รูปแบบ bundler (esbuild vs อื่น) เลือกได้ในงานนี้แต่ต้องบันทึกใน evidence"

